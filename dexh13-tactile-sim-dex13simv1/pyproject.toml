[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexh13sim"
version = "0.1.0"
description = "DexH13 MuJoCo tactile simulation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.1.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "h5py>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "matplotlib",
  "trimesh",
]

[tool.setuptools.packages.find]
include = ["dexh13sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
